name: Verify LIME 2.0
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Formatting, vet, build, race, browser contracts, 90% diff coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify.sh "$BASE_REF"
